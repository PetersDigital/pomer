name: pomer
description: "Pomer — A Pomodoro timer app for Android, Windows & Web. By PetersDigital."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.4
  google_fonts: ^6.2.1
  wakelock_plus: ^1.4.0
  just_audio: ^0.10.5
  flutter_foreground_task: ^9.2.0
  flutter_local_notifications: ^20.1.0
  permission_handler: ^12.0.1
  audio_session: ^0.2.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3
  mockito: ^5.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
